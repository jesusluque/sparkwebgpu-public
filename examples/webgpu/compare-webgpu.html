<!DOCTYPE html>
<html lang="en">
<!-- The WebGPU side of the comparison with compare-webgl.html. -->
<head>
  <meta charset="utf-8">
  <title>Spark • compare (WebGPU)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/build/three.webgpu.js", "three/webgpu": "../js/vendor/three/build/three.webgpu.js", "@sparkjsdev/spark": "../../dist/spark.module.js", "@sparkjsdev/spark/webgpu": "../../dist/spark.webgpu.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { ExtSplats, PackedSplats, PagedSplats, utils } from "@sparkjsdev/spark";
    import { GpuSplatSource, WgpuReadTarget, WgpuLod, WgpuSplatRenderer } from "@sparkjsdev/spark/webgpu";
    import { getAssetFileURL } from "../js/get-asset-url.js";
    import { bench, setupCompare, syntheticPacked, waitSettled } from "./compare.js";

    const { file, n, flat, lod, rad, lodSplatCount, pose, size, options, ext } = setupCompare();
    // The page pool binds whole pools: take the adapter's larger limits.
    const adapter = await navigator.gpu.requestAdapter();
    const renderer = new THREE.WebGPURenderer({
      requiredLimits: {
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    renderer.setSize(size.w, size.h);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(60, size.w / size.h, 0.1, 1000);
    // ?sort=cpu, ?sortBits=24, ?profile=1 (stats.gpuMs), ?rasterizer=tiles|auto,
    // and ?opts=<JSON> for any other WgpuSplatRenderer option.
    const query = new URLSearchParams(location.search);
    const splats = new WgpuSplatRenderer(renderer, {
      sort: query.get("sort") ?? "gpu",
      sortBits: Number(query.get("sortBits") ?? 32),
      profile: query.get("profile") === "1",
      rasterizer: query.get("rasterizer") ?? "hardware",
      ...options,
      ...JSON.parse(query.get("opts") ?? "{}"),
    });
    const holder = new THREE.Object3D();
    pose(holder);
    const lodDriver = lod || rad ? new WgpuLod(splats, { lodSplatCount }) : null;
    if (rad) {
      await lodDriver.add(new PagedSplats({ rootUrl: rad }), holder);
    } else if (ext && !n && !lod) {
      const splatsExt = new ExtSplats({ url: await getAssetFileURL(file) });
      await splatsExt.initialized;
      splats.add(GpuSplatSource.fromExtSplats(splats.device, splatsExt), holder);
    } else {
      const packed = n
        ? new PackedSplats({ packedArray: syntheticPacked(utils, n, flat), numSplats: n })
        : new PackedSplats({ url: await getAssetFileURL(file), lod });
      if (lodDriver) {
        await lodDriver.add(packed, holder);
      } else {
        await packed.initialized;
        splats.add(GpuSplatSource.fromPackedSplats(splats.device, packed), holder);
      }
    }
    window.__splats = splats;
    window.__lod = lodDriver;
    // An offscreen render read back (WgpuReadTarget).
    window.__readTarget = async (width, height, superXY = 1) => {
      const offscreen = new WgpuReadTarget(splats, { width, height, superXY });
      return Array.from(await offscreen.renderReadTarget({ scene, camera }));
    };
    const settled = lodDriver
      ? waitSettled(() => ({
        lod: lodDriver.stats.traversals,
        splats: lodDriver.stats.lodSplats,
        pending: lodDriver.stats.traversals === 0 || (lodDriver.pager?.isPending() ?? false),
      }))
      : Promise.resolve();
    settled.then((s) => { window.__lodState = s; });
    let frames = 0;
    renderer.setAnimationLoop(() => {
      lodDriver?.update(camera);
      renderer.render(scene, camera);
      splats.render(camera);
      if (++frames >= 30 && window.__lodState !== undefined || (!lodDriver && frames === 30)) window.__ready = true;
    });
    // Throughput: the normal animation loop for `seconds`, the object turning
    // `spin` radians every frame (0: still, the draw alone); frames counted
    // (run Chrome without vsync to uncap it).
    window.__fps = (seconds, spin = 0.01) =>
      new Promise((resolve) => {
        let count = 0;
        const t0 = performance.now();
        renderer.setAnimationLoop(() => {
          holder.rotation.y += spin;
          lodDriver?.update(camera);
          renderer.render(scene, camera);
        splats.render(camera);
          count++;
          const t = performance.now() - t0;
          if (t >= seconds * 1000) {
            renderer.setAnimationLoop(null);
            resolve({ fps: (count * 1000) / t, msPerFrame: t / count });
          }
        });
      });
    // GPU pass timings (?profile=1): `count` frames one at a time, each read
    // back before the next (an unthrottled loop starves mapAsync), medians
    // per pass in ms.
    window.__profile = async (count) => {
      renderer.setAnimationLoop(null);
      const profiler = splats.profiler;
      const frames = [];
      for (let i = 0; i < count; i++) {
        holder.rotation.y += 0.01;
        lodDriver?.update(camera);
        renderer.render(scene, camera);
        splats.render(camera);
        const resolved = profiler.resolved;
        const t0 = performance.now();
        while (profiler.resolved === resolved && performance.now() - t0 < 1000) {
          await new Promise((resolve) => setTimeout(resolve, 1));
        }
        frames.push({ ...profiler.last });
      }
      const median = {};
      for (const label of Object.keys(frames.at(-1))) {
        const v = frames.map((f) => f[label] ?? 0).sort((a, b) => a - b);
        median[label] = v[v.length >> 1];
      }
      return median;
    };
    window.__bench = async (count) => {
      renderer.setAnimationLoop(null);
      const result = await bench(count, async () => {
        holder.rotation.y += 0.01;
        lodDriver?.update(camera);
        renderer.render(scene, camera);
        splats.render(camera);
        await splats.device.queue.onSubmittedWorkDone();
      });
      return { ...result, cpuSortMs: splats.stats.sortMs, sorts: splats.stats.sorts };
    };
  </script>
</body>
</html>
